name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Design contract
        run: npm run design:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Credential and Compose boundary
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'Admin@1234' backend/src frontend/src; then
            echo "Embedded demo credential detected"
            exit 1
          fi
          grep -q 'SEED_DEMO_PASSWORD' backend/src/prisma/seed.ts
          JWT_SECRET='ci-access-secret-only' JWT_REFRESH_SECRET='ci-refresh-secret-only' docker compose config >/dev/null
