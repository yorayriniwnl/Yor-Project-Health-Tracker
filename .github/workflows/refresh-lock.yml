name: Refresh dependency lock

on:
  push:
    branches:
      - fix/credibility-ci-20260930
    paths:
      - ".github/workflows/refresh-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/credibility-ci-20260930
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Refresh patched versions within declared ranges
        run: npm audit fix --package-lock-only
      - name: Verify high-severity production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile update required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "deps: refresh patched dependency lock"
          git push origin HEAD:fix/credibility-ci-20260930
