name: Refresh dependency lock

on:
  push:
    branches:
      - fix/credibility-ci-20260930
    paths:
      - ".github/workflows/refresh-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/credibility-ci-20260930
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Apply available security updates
        run: npm audit fix --force
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify design contract
        run: npm run design:check
      - name: Verify typecheck
        run: npm run typecheck
      - name: Verify build
        run: npm run build
      - name: Commit validated dependency updates
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json frontend/package.json backend/package.json; then
            echo "No dependency update required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json frontend/package.json backend/package.json
          git commit -m "deps: apply validated security updates"
          git push origin HEAD:fix/credibility-ci-20260930
